[build-system]
requires = [
  "scikit-build-core>=0.9",
  "pybind11>=3.0",
  # "cmake>=3.20",
  # "ninja>=1.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "epiclibcpp"
version = "0.2.2"
description = "EPIC cognitive architecture C++ core exposed as a Python module via pybind11"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Travis Seymour" }]
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: C++",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/travisseymour/epiclibcpp"
Issues = "https://github.com/travisseymour/epiclibcpp/issues"

[tool.scikit-build]
wheel.expand-macos-universal-tags = false

[tool.scikit-build.cmake]
